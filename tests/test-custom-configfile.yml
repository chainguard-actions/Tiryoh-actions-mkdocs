name: Test custom configfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up MkDocs project with custom config path
        run: |
          cp tests/fixtures/custom-config/custom-mkdocs.yml "$GITHUB_WORKSPACE/custom-mkdocs.yml"
          mkdir -p "$GITHUB_WORKSPACE/docs"
          cp tests/fixtures/custom-config/docs/index.md "$GITHUB_WORKSPACE/docs/index.md"

      - id: action
        uses: .
        with:
          mkdocs_version: 'latest'
          requirements: 'requirements.txt'
          configfile: 'custom-mkdocs.yml'

      - name: Assert site directory was created
        run: |
          echo "Checking for built site directory..."
          if [ ! -d "$GITHUB_WORKSPACE/site" ]; then
            echo "FAIL: site/ directory was not created by mkdocs build"
            exit 1
          fi
          echo "PASS: site/ directory exists"

      - name: Assert index.html was generated
        run: |
          echo "Checking for index.html..."
          if [ ! -f "$GITHUB_WORKSPACE/site/index.html" ]; then
            echo "FAIL: site/index.html was not generated"
            exit 1
          fi
          echo "PASS: site/index.html exists"

      - name: Assert site name is from custom config
        run: |
          echo "Checking site name in generated HTML..."
          SITE_NAME=$(grep -o 'Custom Config Site' "$GITHUB_WORKSPACE/site/index.html" | head -1 || true)
          echo "site name found: $SITE_NAME"
          if [ -z "$SITE_NAME" ]; then
            echo "FAIL: expected 'Custom Config Site' in generated HTML"
            exit 1
          fi
          echo "PASS: site name matches custom config"
